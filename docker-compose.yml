version: "3.8"

services:
  crawler-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hanoi-it-job-radar
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - PYTHONUNBUFFERED=1
    volumes:
      # Persistent storage for SQLite database (deduplication)
      - ./data:/app/data
      # Persistent log files for auditing
      - ./logs:/app/logs
      # Mount Facebook cookies file strictly as Read-Only
      - ./cookies:/app/cookies:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Resource constraints tuned for 1 CPU / 1GB RAM + 2GB Swap VPS
    mem_limit: 450m
    memswap_limit: 1500m
    cpus: 0.75

